name: CI

# OP15 branch: checks only. This module is deliberately never released - the
# OP15 cannot transmit (its kernel panics on TX, measured 2026-09-13), so it
# ships nothing to a release page. main carries the OP11 module and its releases.

on:
  push:
    branches: [OP15]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint scripts and WebUI wiring
        run: bash tools/lint.sh

      - name: Drivers against the stack this device actually runs
        run: |
          # A leaf like 8812au imports from the other bundled modules rather
          # than from cfg80211, so siblings are references too or it would
          # compare against nothing.
          # This module keeps the ROM's cfg80211 AND its mac80211 - it ships
          # neither - so every driver is checked against the export CRCs
          # recorded from the device itself.
          rc=0
          for ko in drivers/*.ko; do
            python3 tools/check-crcs.py "$ko" \
              tools/device_cfg80211.symvers tools/device_mac80211.symvers drivers/*.ko || rc=1
          done
          exit $rc

      - name: This module must not ship a mac80211
        run: |
          if [ -f mac80211.ko ]; then
            echo "::error::OP15 must not ship mac80211.ko - wonder and qca_cld3_peach_v2 are bound to the stock one"
            exit 1
          fi
          echo "no mac80211.ko, correct for this device"

      - name: Firmware the drivers ask for is present
        run: python3 tools/check-firmware.py .

      - name: Build the zip (artifact only, never released)
        run: bash tools/package.sh op15.zip

      - uses: actions/upload-artifact@v4
        with:
          name: op15-nethunter-wifi
          path: op15.zip
