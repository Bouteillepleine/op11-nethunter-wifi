name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      # the default token is read-only in this repo; the release step needs write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Lint scripts and WebUI wiring
        run: bash tools/lint.sh

      - name: mac80211 against the device's own cfg80211 CRCs
        run: python3 tools/check-crcs.py mac80211.ko tools/device_cfg80211.symvers

      - name: Drivers against the mac80211 they ship with
        run: |
          rc=0
          for ko in drivers/*.ko; do
            python3 tools/check-crcs.py "$ko" mac80211.ko || rc=1
          done
          exit $rc

      - name: Firmware the drivers ask for is present
        run: python3 tools/check-firmware.py .

      - name: Build the flashable zip
        run: bash tools/package.sh module.zip

      - uses: actions/upload-artifact@v4
        with:
          name: op11-nethunter-wifi
          path: module.zip

      - name: Release on a tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/^version=//p' module.prop)
          mv module.zip "op11-nethunter-wifi-$ver.zip"
          gh release create "${GITHUB_REF_NAME}" "op11-nethunter-wifi-$ver.zip" \
            --title "$ver" --notes "Built from ${GITHUB_SHA}"
